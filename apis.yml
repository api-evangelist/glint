name: Glint
description: 'Glint is an employee-engagement and organizational-health platform built on people-science
  pulse surveys, manager dashboards, and action-planning analytics. Founded in 2013 and backed by Bessemer
  Venture Partners and Shasta Ventures, Glint was acquired by LinkedIn in 2018 and subsequently folded
  into Microsoft, where it now ships as Microsoft Viva Glint within the Microsoft Viva employee-experience
  suite. The original glintinc.com domain now redirects to Microsoft, and the product is administered
  through the Microsoft 365 tenant and Microsoft Entra ID rather than a standalone public developer API;
  Glint does not publish an independent OpenAPI, REST API reference, or developer portal.'
